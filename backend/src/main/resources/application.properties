spring.application.name=mediscan-backend
server.port=8080

# Default datastore is a file-backed H2 database so the stack runs with no
# external services. Switch to MySQL with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/mediscan;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Python ML inference service
mediscan.ml.base-url=http://localhost:8001
mediscan.ml.timeout-seconds=120

# JWT. Override in production: MEDISCAN_JWT_SECRET env var.
mediscan.jwt.secret=${MEDISCAN_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4}
mediscan.jwt.expiry-minutes=720

mediscan.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Medical Assistant (LLM). The key is read from the environment and must never
# be committed or exposed to the browser; React always calls our own endpoint.
# provider: openai | anthropic
mediscan.assistant.provider=${MEDISCAN_ASSISTANT_PROVIDER:openai}
mediscan.assistant.api-key=${MEDISCAN_ASSISTANT_API_KEY:}
mediscan.assistant.model=${MEDISCAN_ASSISTANT_MODEL:gpt-4o-mini}
mediscan.assistant.max-tokens=600
mediscan.assistant.max-history=10
mediscan.assistant.timeout-seconds=45

logging.level.com.mediscan=INFO
