spring.application.name=mediscan-backend
server.port=8080

# Default datastore is a file-backed H2 database so the stack runs with no
# external services. Switch to MySQL with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/mediscan;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Python ML inference service
mediscan.ml.base-url=http://localhost:8001
mediscan.ml.timeout-seconds=120

# Firebase Authentication. Point at the service-account JSON downloaded from
# console.firebase.google.com (Project settings > Service accounts > Generate new
# private key). The default below matches backend/firebase/service-account.json
# (gitignored). Override in production: MEDISCAN_FIREBASE_SERVICE_ACCOUNT env var.
mediscan.firebase.service-account-path=${MEDISCAN_FIREBASE_SERVICE_ACCOUNT:firebase/service-account.json}

# Gmail SMTP for welcome / sign-in notification emails. Use an App Password
# (not your normal Gmail password): myaccount.google.com > Security > 2-Step
# Verification > App passwords. Set MEDISCAN_MAIL_USERNAME / MEDISCAN_MAIL_PASSWORD.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MEDISCAN_MAIL_USERNAME:}
spring.mail.password=${MEDISCAN_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mediscan.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Medical Assistant (LLM). The key is read from the environment and must never
# be committed or exposed to the browser; React always calls our own endpoint.
# provider: openai | anthropic
mediscan.assistant.provider=${MEDISCAN_ASSISTANT_PROVIDER:openai}
mediscan.assistant.api-key=${MEDISCAN_ASSISTANT_API_KEY:}
mediscan.assistant.model=${MEDISCAN_ASSISTANT_MODEL:gpt-4o-mini}
mediscan.assistant.max-tokens=600
mediscan.assistant.max-history=10
mediscan.assistant.timeout-seconds=45

logging.level.com.mediscan=INFO
