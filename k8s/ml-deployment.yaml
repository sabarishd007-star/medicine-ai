apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediscan-ml-deployment
  labels:
    app: mediscan-ml
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mediscan-ml
  template:
    metadata:
      labels:
        app: mediscan-ml
    spec:
      containers:
        - name: ml-service
          image: sabarishd007/mediscan-ml:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              memory: "4Gi"
              cpu: "2"
            requests:
              memory: "2Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mediscan-ml-service
spec:
  type: ClusterIP
  selector:
    app: mediscan-ml
  ports:
    - name: http
      port: 8000
      targetPort: http
