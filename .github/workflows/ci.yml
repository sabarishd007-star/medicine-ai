name: MediScan AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build

  ml-service-ci:
    name: ML Microservice (FastAPI)
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      MEDISCAN_ASSISTANT_API_KEY: mock_ci_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/ml-service/requirements.txt
      - name: Install dependencies
        working-directory: backend/ml-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        working-directory: backend/ml-service
        run: python -m pytest tests/ -v --maxfail=1 -o addopts=''

  backend-ci:
    name: Backend Gateway (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run tests
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --console=plain

  release-gate:
    name: Production Release Gate
    needs: [frontend-ci, ml-service-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm quality gate
        run: |
          echo "All builds and tests passed across React, FastAPI, and Spring Boot."
          echo "The repository is verified for deployment."
